apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard-home-climate
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  home-climate.json: |-
    {
      "uid": "home-climate",
      "title": "Home Climate",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Temperatures",
          "type": "timeseries",
          "datasource": { "type": "influxdb", "uid": "influxdb" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": { "lineInterpolation": "smooth", "fillOpacity": 10 }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "query": "import \"regexp\"\n\nfrom(bucket: \"homeassistant\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r[\"_measurement\"] == \"°C\")\n  |> filter(fn: (r) => r[\"_field\"] == \"value\")\n  |> filter(fn: (r) => exists r[\"friendly_name\"])\n  |> map(fn: (r) => ({_time: r._time, _value: r._value, _field: regexp.replaceAllString(r: /^sensor-climate-(.+?) .+$/, v: r[\"friendly_name\"], t: \"$1\")}))\n  |> group(columns: [\"_field\"])"
            }
          ]
        },
        {
          "id": 2,
          "title": "Humidities",
          "type": "timeseries",
          "datasource": { "type": "influxdb", "uid": "influxdb" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "humidity",
              "custom": { "lineInterpolation": "smooth", "fillOpacity": 10 }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "query": "import \"regexp\"\n\nfrom(bucket: \"homeassistant\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r[\"_measurement\"] == \"%\")\n  |> filter(fn: (r) => r[\"_field\"] == \"value\")\n  |> filter(fn: (r) => r[\"domain\"] == \"sensor\")\n  |> filter(fn: (r) => r[\"entity_id\"] =~ /humidity/)\n  |> filter(fn: (r) => exists r[\"friendly_name\"])\n  |> map(fn: (r) => ({_time: r._time, _value: r._value, _field: regexp.replaceAllString(r: /^sensor-climate-(.+?) .+$/, v: r[\"friendly_name\"], t: \"$1\")}))\n  |> group(columns: [\"_field\"])"
            }
          ]
        }
      ]
    }
