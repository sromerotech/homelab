            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "import \"regexp\"\nimport \"date\"\nimport \"strings\"\n\nfrom(bucket: \"homeassistant\")\n  |> range(start: date.truncate(t: now(), unit: 1d))\n  |> filter(fn: (r) => r[\"_measurement\"] == \"°C\" and r[\"_field\"] == \"value\" and exists r[\"friendly_name\"])\n  |> map(fn: (r) => ({_time: r._time, _value: r._value, _field: regexp.replaceAllString(r: /^sensor-climate-(.+?) .+$/, v: r[\"friendly_name\"], t: \"$1\")}))\n  |> group(columns: [\"_field\"])\n  |> max()\n  |> group()\n  |> sort(columns: [\"_value\"], desc: true)\n  |> first()\n  |> map(fn: (r) => ({_time: r._time, _value: r._value, _field: r._field + \" · \" + strings.replaceAll(v: strings.substring(v: string(v: r._time), start: 0, end: 16), t: \"T\", u: \" \")}))\n  |> group(columns: [\"_field\"])"
            }
