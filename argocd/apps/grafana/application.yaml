apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-grafana
  namespace: argocd
  labels:
    argocd.sromerotech.home/app: 'true'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  source:
    repoURL: 'git@github.com:sromerotech/homelab.git'
    targetRevision: main
    path: argocd/apps/grafana/chart
    helm:
      releaseName: grafana
      valueFiles:
        - values.yaml
        - secrets://secrets.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
