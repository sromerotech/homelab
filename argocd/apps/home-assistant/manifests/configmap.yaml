apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config-file
data:
  configuration.yaml: |
    automation: !include_dir_merge_list automations/
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
        - 10.43.0.0/16
    mobile_app:
    influxdb:
      api_version: 2
      host: influxdb-influxdb2.monitoring.svc.cluster.local
      port: 8086
      ssl: false
      token: !env_var INFLUXDB_TOKEN
      organization: homelab
      bucket: homeassistant
      tags_attributes:
        - friendly_name
      include:
        entity_globs:
          - sensor.*temperature*
          - sensor.*humidity*
    lovelace:
      mode: storage
      dashboards:
        lovelace-climate:
          mode: yaml
          title: Climate
          icon: mdi:thermometer
          show_in_sidebar: true
          filename: dashboards/climate.yaml
