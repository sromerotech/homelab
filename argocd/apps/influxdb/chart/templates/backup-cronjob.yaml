apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: public.ecr.aws/docker/library/influxdb:2.7
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  HOST="http://{{ .Release.Name }}-influxdb2.{{ .Release.Namespace }}.svc.cluster.local:8086"
                  ORG="homelab"
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/tmp/influxdb-backup-${TIMESTAMP}"
                  DAILY_PREFIX="influxdb/backups/daily"
                  QUARTERLY_PREFIX="influxdb/backups/quarterly"

                  echo "Starting InfluxDB full backup..."
                  influx backup "${BACKUP_DIR}" \
                    --host "${HOST}" \
                    --token "${INFLUXDB_TOKEN}"

                  echo "Installing AWS CLI..."
                  apt-get update -qq && apt-get install -y -qq awscli > /dev/null

                  echo "Uploading full backup to S3..."
                  aws s3 cp "${BACKUP_DIR}" \
                    "s3://${S3_BUCKET}/${DAILY_PREFIX}/${TIMESTAMP}/" \
                    --recursive \
                    --endpoint-url "${S3_ENDPOINT}"

                  echo "Cleaning up daily backups older than ${BACKUP_RETENTION_DAYS} days..."
                  CUTOFF=$(date -d "-${BACKUP_RETENTION_DAYS} days" +%Y%m%d)
                  aws s3 ls "s3://${S3_BUCKET}/${DAILY_PREFIX}/" \
                    --endpoint-url "${S3_ENDPOINT}" \
                    | awk '{print $2}' | tr -d '/' \
                    | while read -r dir; do
                        DIR_DATE=$(echo "${dir}" | cut -d'-' -f1)
                        [ -z "${DIR_DATE}" ] && continue
                        if [ "${DIR_DATE}" -lt "${CUTOFF}" ] 2>/dev/null; then
                          echo "Deleting old backup: ${dir}"
                          aws s3 rm "s3://${S3_BUCKET}/${DAILY_PREFIX}/${dir}/" \
                            --recursive --endpoint-url "${S3_ENDPOINT}"
                        fi
                      done

                  echo "Exporting quarter-to-date history (read-only Flux query, no writes to production)..."
                  YEAR=$(date +%Y)
                  MONTH=$(date +%m)
                  MONTH=${MONTH#0}
                  QUARTER=$(( (MONTH - 1) / 3 + 1 ))
                  QUARTER_KEY="${YEAR}-Q${QUARTER}"
                  QSTART_MONTH=$(( (QUARTER - 1) * 3 + 1 ))
                  QUARTER_START=$(printf '%04d-%02d-01T00:00:00Z' "${YEAR}" "${QSTART_MONTH}")

                  for BUCKET in homelab homeassistant; do
                    echo "Exporting ${BUCKET} (${QUARTER_START} .. now) as ${QUARTER_KEY}..."
                    influx query \
                      --host "${HOST}" \
                      --org "${ORG}" \
                      --token "${INFLUXDB_TOKEN}" \
                      --raw \
                      "from(bucket: \"${BUCKET}\") |> range(start: ${QUARTER_START})" \
                      > "/tmp/${BUCKET}-${QUARTER_KEY}.csv"

                    gzip -f "/tmp/${BUCKET}-${QUARTER_KEY}.csv"

                    aws s3 cp "/tmp/${BUCKET}-${QUARTER_KEY}.csv.gz" \
                      "s3://${S3_BUCKET}/${QUARTERLY_PREFIX}/${QUARTER_KEY}/${BUCKET}.csv.gz" \
                      --endpoint-url "${S3_ENDPOINT}"
                  done

                  echo "Backup complete: ${TIMESTAMP}"
              env:
                - name: INFLUXDB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-influxdb2-auth
                      key: admin-token
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: "scaleway-app.homelab"
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: "scaleway-app.homelab"
                      key: secret-access-key
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: "scaleway-app.homelab"
                      key: region
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: "scaleway-app.homelab"
                      key: endpoint
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: "scaleway-app.homelab"
                      key: bucket
                - name: BACKUP_RETENTION_DAYS
                  value: "30"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
