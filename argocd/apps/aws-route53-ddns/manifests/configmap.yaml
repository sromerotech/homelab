apiVersion: v1
kind: ConfigMap
metadata:
  name: route53-ddns-config
  namespace: aws-scripts
data:
  RECORD_TTL: "300"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: route53-ddns-script
  namespace: aws-scripts
data:
  update.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    # Resolve public IP, falling back to a second provider if the first fails
    PUBLIC_IP=""
    for url in "https://checkip.amazonaws.com" "https://api.ipify.org"; do
      PUBLIC_IP=$(curl -sf --max-time 10 "$url" | tr -d '[:space:]') && break || true
    done
    if [[ -z "$PUBLIC_IP" ]]; then
      echo "[ERROR] Could not determine public IP" >&2
      exit 1
    fi
    echo "[INFO] Public IP: $PUBLIC_IP"

    # Read current A record value from Route 53 (source of truth, no local state)
    CURRENT_IP=$(aws route53 list-resource-record-sets \
      --hosted-zone-id "$HOSTED_ZONE_ID" \
      --query "ResourceRecordSets[?Name=='${RECORD_NAME}.' && Type=='A'].ResourceRecords[0].Value" \
      --output text 2>/dev/null || true)

    echo "[INFO] Route 53 current value: ${CURRENT_IP:-"(not found)"}"

    if [[ "$PUBLIC_IP" == "$CURRENT_IP" ]]; then
      echo "[INFO] No change needed."
      exit 0
    fi

    # UPSERT the A record
    CHANGE_BATCH=$(cat <<EOF
    {
      "Comment": "route53-ddns auto-update",
      "Changes": [{
        "Action": "UPSERT",
        "ResourceRecordSet": {
          "Name": "${RECORD_NAME}",
          "Type": "A",
          "TTL": ${RECORD_TTL},
          "ResourceRecords": [{"Value": "${PUBLIC_IP}"}]
        }
      }]
    }
    EOF
    )

    aws route53 change-resource-record-sets \
      --hosted-zone-id "$HOSTED_ZONE_ID" \
      --change-batch "$CHANGE_BATCH" \
      --output text --query 'ChangeInfo.Status' > /dev/null

    echo "[INFO] Updated ${RECORD_NAME}: ${CURRENT_IP:-"(none)"} -> ${PUBLIC_IP}"
